components:
  schemas:
    Bay:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        locationId:
          type: string
          format: uuid
          readOnly: true
        label:
          type: string
          pattern: ^[A-Z0-9-]{1,16}$
        vehicleClass:
          $ref: '#/components/schemas/VehicleClassEnum'
        mode:
          $ref: '#/components/schemas/BayModeEnum'
        state:
          allOf:
          - $ref: '#/components/schemas/BayStateEnum'
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
      required:
      - createdAt
      - id
      - label
      - locationId
      - mode
      - state
      - vehicleClass
    BayModeEnum:
      enum:
      - WALK_IN
      - RESERVABLE
      type: string
      description: |-
        * `WALK_IN` - Walk In
        * `RESERVABLE` - Reservable
    BayRequest:
      type: object
      properties:
        label:
          type: string
          minLength: 1
          pattern: ^[A-Z0-9-]{1,16}$
        vehicleClass:
          $ref: '#/components/schemas/VehicleClassEnum'
        mode:
          $ref: '#/components/schemas/BayModeEnum'
      required:
      - label
      - mode
      - vehicleClass
    BayStateEnum:
      enum:
      - ACTIVE
      - OUT_OF_SERVICE
      type: string
      description: |-
        * `ACTIVE` - Active
        * `OUT_OF_SERVICE` - Out Of Service
    CashPaymentRequest:
      type: object
      properties:
        method:
          $ref: '#/components/schemas/PaymentMethodEnum'
        amountPaisa:
          type: integer
          maximum: 10000000
          minimum: 1
      required:
      - amountPaisa
      - method
    CheckoutRequest:
      type: object
      properties:
        quoteToken:
          type: string
          minLength: 1
          maxLength: 512
      required:
      - quoteToken
    CurrentShift:
      type: object
      properties:
        shift:
          allOf:
          - $ref: '#/components/schemas/Shift'
          nullable: true
      required:
      - shift
    EntryKindEnum:
      enum:
      - CAPTURE
      type: string
      description: '* `CAPTURE` - Capture'
    EntryRequest:
      type: object
      properties:
        locationId:
          type: string
          format: uuid
        bayId:
          type: string
          format: uuid
        plate:
          type: string
          minLength: 1
          maxLength: 16
        vehicleClass:
          $ref: '#/components/schemas/VehicleClassEnum'
      required:
      - bayId
      - locationId
      - plate
      - vehicleClass
    Health:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    Invoice:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        cutoffAt:
          type: string
          format: date-time
          readOnly: true
        billableSeconds:
          type: integer
          readOnly: true
        blocks:
          type: integer
          readOnly: true
        basePaisa:
          type: integer
          readOnly: true
        discountPaisa:
          type: integer
          readOnly: true
        taxPaisa:
          type: integer
          readOnly: true
        totalPaisa:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/InvoiceStatusEnum'
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
      required:
      - basePaisa
      - billableSeconds
      - blocks
      - createdAt
      - cutoffAt
      - discountPaisa
      - id
      - status
      - taxPaisa
      - totalPaisa
    InvoiceStatusEnum:
      enum:
      - CONFIRMED
      type: string
      description: '* `CONFIRMED` - Confirmed'
    Location:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 120
        address:
          type: string
          maxLength: 240
        latitude:
          type: number
          format: double
          maximum: 90
          minimum: -90
        longitude:
          type: number
          format: double
          maximum: 180
          minimum: -180
        receiptPrefix:
          type: string
          pattern: ^[A-Z0-9]{2,8}$
        timezone:
          type: string
          readOnly: true
        enabled:
          type: boolean
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
      required:
      - address
      - createdAt
      - enabled
      - id
      - latitude
      - longitude
      - name
      - receiptPrefix
      - timezone
    LocationRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        address:
          type: string
          minLength: 1
          maxLength: 240
        latitude:
          type: number
          format: double
          maximum: 90
          minimum: -90
        longitude:
          type: number
          format: double
          maximum: 180
          minimum: -180
        receiptPrefix:
          type: string
          minLength: 1
          pattern: ^[A-Z0-9]{2,8}$
      required:
      - address
      - latitude
      - longitude
      - name
      - receiptPrefix
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - email
      - password
    Member:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        name:
          type: string
          readOnly: true
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleEnum'
          readOnly: true
          maxItems: 5
        enabled:
          type: boolean
          readOnly: true
        revision:
          type: integer
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
      required:
      - createdAt
      - email
      - enabled
      - id
      - name
      - revision
      - roles
    MembershipSummary:
      type: object
      properties:
        organisationId:
          type: string
          format: uuid
        organisationName:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleEnum'
          maxItems: 5
      required:
      - organisationId
      - organisationName
      - roles
    PaginatedBayList:
      type: object
      required:
      - data
      - page
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Bay'
        page:
          type: object
          required:
          - next
          - previous
          properties:
            next:
              type: string
              nullable: true
            previous:
              type: string
              nullable: true
    PaginatedLocationList:
      type: object
      required:
      - data
      - page
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Location'
        page:
          type: object
          required:
          - next
          - previous
          properties:
            next:
              type: string
              nullable: true
            previous:
              type: string
              nullable: true
    PaginatedMemberList:
      type: object
      required:
      - data
      - page
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Member'
        page:
          type: object
          required:
          - next
          - previous
          properties:
            next:
              type: string
              nullable: true
            previous:
              type: string
              nullable: true
    PaginatedSessionSummaryList:
      type: object
      required:
      - data
      - page
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SessionSummary'
        page:
          type: object
          required:
          - next
          - previous
          properties:
            next:
              type: string
              nullable: true
            previous:
              type: string
              nullable: true
    PaginatedTariffVersionList:
      type: object
      required:
      - data
      - page
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TariffVersion'
        page:
          type: object
          required:
          - next
          - previous
          properties:
            next:
              type: string
              nullable: true
            previous:
              type: string
              nullable: true
    ParkingSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        locationId:
          type: string
          format: uuid
          readOnly: true
        bayId:
          type: string
          format: uuid
          readOnly: true
        bayLabel:
          type: string
          readOnly: true
        plate:
          type: string
          readOnly: true
        vehicleClass:
          allOf:
          - $ref: '#/components/schemas/VehicleClassEnum'
          readOnly: true
        tariffId:
          type: string
          format: uuid
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/SessionStatusEnum'
          readOnly: true
        enteredAt:
          type: string
          format: date-time
          readOnly: true
        exitedAt:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - bayId
      - bayLabel
      - enteredAt
      - exitedAt
      - id
      - locationId
      - plate
      - status
      - tariffId
      - vehicleClass
    PatchedMemberUpdateRequest:
      type: object
      properties:
        expectedRevision:
          type: integer
          minimum: 1
        roles:
          type: array
          items:
