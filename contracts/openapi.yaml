openapi: 3.0.3
info:
  title: Bayline API
  version: 1.0.0
paths:
  /api/v1/auth/login:
    post:
      operationId: auth_login_create
      description: DRF only checks CSRF for signed-in sessions; login and registration
        must check it too.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Session'
          description: ''
  /api/v1/auth/logout:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/register:
    post:
      operationId: auth_register_create
      description: DRF only checks CSRF for signed-in sessions; login and registration
        must check it too.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Session'
          description: ''
  /api/v1/auth/session:
    get:
      operationId: auth_session_retrieve
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Session'
          description: ''
    patch:
      operationId: auth_session_partial_update
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSwitchOrganisationRequest'
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Session'
          description: ''
  /api/v1/health/live:
    get:
      operationId: health_live_retrieve
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/health/ready:
    get:
      operationId: health_ready_retrieve
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/locations:
    get:
      operationId: locations_list
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - locations
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLocationList'
          description: ''
    post:
      operationId: locations_create
      tags:
      - locations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Location'
          description: ''
  /api/v1/locations/{location_id}/bays:
    get:
      operationId: locations_bays_list
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: path
        name: location_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - locations
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBayList'
          description: ''
    post:
      operationId: locations_bays_create
      parameters:
      - in: path
        name: location_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - locations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BayRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Bay'
          description: ''
  /api/v1/locations/{location_id}/tariffs:
    get:
      operationId: locations_tariffs_list
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: path
        name: location_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - locations
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTariffVersionList'
          description: ''
    post:
      operationId: locations_tariffs_create
      parameters:
      - in: path
        name: location_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - locations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TariffPublishRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/TariffVersion'
          description: ''
  /api/v1/members:
    get:
      operationId: members_list
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - members
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMemberList'
          description: ''
  /api/v1/members/{member_id}:
    get:
      operationId: members_retrieve
      parameters:
      - in: path
        name: member_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - members
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Member'
          description: ''
    patch:
      operationId: members_partial_update
      parameters:
      - in: path
        name: member_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - members
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMemberUpdateRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Member'
          description: ''
components:
  schemas:
    Bay:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        locationId:
          type: string
          format: uuid
          readOnly: true
        label:
          type: string
          pattern: ^[A-Z0-9-]{1,16}$
        vehicleClass:
          $ref: '#/components/schemas/VehicleClassEnum'
        mode:
          $ref: '#/components/schemas/BayModeEnum'
        state:
          allOf:
          - $ref: '#/components/schemas/BayStateEnum'
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
      required:
      - createdAt
      - id
      - label
      - locationId
      - mode
      - state
      - vehicleClass
    BayModeEnum:
      enum:
      - WALK_IN
      - RESERVABLE
      type: string
      description: |-
        * `WALK_IN` - Walk In
        * `RESERVABLE` - Reservable
    BayRequest:
      type: object
      properties:
        label:
          type: string
          minLength: 1
          pattern: ^[A-Z0-9-]{1,16}$
        vehicleClass:
          $ref: '#/components/schemas/VehicleClassEnum'
        mode:
          $ref: '#/components/schemas/BayModeEnum'
      required:
      - label
      - mode
      - vehicleClass
    BayStateEnum:
      enum:
      - ACTIVE
      - OUT_OF_SERVICE
      type: string
      description: |-
        * `ACTIVE` - Active
        * `OUT_OF_SERVICE` - Out Of Service
    Health:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    Location:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 120
        address:
          type: string
          maxLength: 240
        latitude:
          type: number
          format: double
          maximum: 90
          minimum: -90
        longitude:
          type: number
          format: double
          maximum: 180
          minimum: -180
        receiptPrefix:
          type: string
          pattern: ^[A-Z0-9]{2,8}$
        timezone:
          type: string
          readOnly: true
        enabled:
          type: boolean
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
      required:
      - address
      - createdAt
      - enabled
      - id
      - latitude
      - longitude
      - name
      - receiptPrefix
      - timezone
    LocationRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        address:
          type: string
          minLength: 1
          maxLength: 240
        latitude:
          type: number
          format: double
          maximum: 90
          minimum: -90
        longitude:
          type: number
          format: double
          maximum: 180
          minimum: -180
        receiptPrefix:
          type: string
          minLength: 1
          pattern: ^[A-Z0-9]{2,8}$
      required:
      - address
      - latitude
      - longitude
      - name
      - receiptPrefix
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - email
      - password
    Member:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        name:
          type: string
          readOnly: true
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleEnum'
          readOnly: true
          maxItems: 5
        enabled:
          type: boolean
          readOnly: true
        revision:
          type: integer
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
      required:
      - createdAt
      - email
      - enabled
      - id
      - name
      - revision
      - roles
    MembershipSummary:
      type: object
      properties:
        organisationId:
          type: string
          format: uuid
        organisationName:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleEnum'
          maxItems: 5
      required:
      - organisationId
      - organisationName
      - roles
    PaginatedBayList:
      type: object
      required:
      - data
      - page
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Bay'
        page:
          type: object
          required:
          - next
          - previous
          properties:
            next:
              type: string
              nullable: true
            previous:
              type: string
              nullable: true
    PaginatedLocationList:
      type: object
      required:
      - data
      - page
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Location'
        page:
          type: object
          required:
          - next
          - previous
          properties:
            next:
              type: string
              nullable: true
            previous:
              type: string
              nullable: true
    PaginatedMemberList:
      type: object
      required:
      - data
      - page
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Member'
        page:
          type: object
          required:
          - next
          - previous
          properties:
            next:
              type: string
              nullable: true
            previous:
              type: string
              nullable: true
    PaginatedTariffVersionList:
      type: object
      required:
      - data
      - page
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TariffVersion'
        page:
          type: object
          required:
          - next
          - previous
          properties:
            next:
              type: string
              nullable: true
            previous:
              type: string
              nullable: true
    PatchedMemberUpdateRequest:
      type: object
      properties:
        expectedRevision:
          type: integer
          minimum: 1
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleEnum'
          maxItems: 5
        enabled:
          type: boolean
    PatchedSwitchOrganisationRequest:
      type: object
      properties:
        activeOrganisationId:
          type: string
          format: uuid
    RegisterRequest:
      type: object
      properties:
        organisationName:
          type: string
          minLength: 1
          maxLength: 120
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - email
      - name
      - organisationName
      - password
    RoleEnum:
      enum:
      - OWNER
      - MANAGER
      - OPERATOR
      - CASHIER
      - AUDITOR
      type: string
      description: |-
        * `OWNER` - Owner
        * `MANAGER` - Manager
        * `OPERATOR` - Operator
        * `CASHIER` - Cashier
        * `AUDITOR` - Auditor
    Session:
      type: object
      properties:
        user:
          allOf:
          - $ref: '#/components/schemas/SessionUser'
          nullable: true
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/MembershipSummary'
        activeOrganisationId:
          type: string
          format: uuid
          nullable: true
      required:
      - activeOrganisationId
      - memberships
      - user
    SessionUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
      required:
      - email
      - id
      - name
    TariffPublishRequest:
      type: object
      properties:
        vehicleClass:
          $ref: '#/components/schemas/VehicleClassEnum'
        effectiveFrom:
          type: string
          format: date-time
        graceSeconds:
          type: integer
          maximum: 86400
          minimum: 0
        blockSeconds:
          type: integer
          maximum: 86400
          minimum: 60
        blockPaisa:
          type: integer
          maximum: 10000000
          minimum: 0
        dailyCapPaisa:
          type: integer
          maximum: 10000000
          minimum: 1
          nullable: true
        taxBps:
          type: integer
          maximum: 10000
          minimum: 0
          default: 0
      required:
      - blockPaisa
      - blockSeconds
      - graceSeconds
      - vehicleClass
    TariffStatusEnum:
      enum:
      - SCHEDULED
      - CURRENT
      - SUPERSEDED
      type: string
      description: |-
        * `SCHEDULED` - Scheduled
        * `CURRENT` - Current
        * `SUPERSEDED` - Superseded
    TariffVersion:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        locationId:
          type: string
          format: uuid
          readOnly: true
        vehicleClass:
          allOf:
          - $ref: '#/components/schemas/VehicleClassEnum'
          readOnly: true
        effectiveFrom:
          type: string
          format: date-time
          readOnly: true
        graceSeconds:
          type: integer
          readOnly: true
        blockSeconds:
          type: integer
          readOnly: true
        blockPaisa:
          type: integer
          readOnly: true
        dailyCapPaisa:
          type: integer
          readOnly: true
          nullable: true
        taxBps:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/TariffStatusEnum'
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
      required:
      - blockPaisa
      - blockSeconds
      - createdAt
      - dailyCapPaisa
      - effectiveFrom
      - graceSeconds
      - id
      - locationId
      - status
      - taxBps
      - vehicleClass
    VehicleClassEnum:
      enum:
      - CAR
      - MOTORBIKE
      type: string
      description: |-
        * `CAR` - Car
        * `MOTORBIKE` - Motorbike
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
