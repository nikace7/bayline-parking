      type: object
      properties:
        countedCashPaisa:
          type: integer
          maximum: 10000000
          minimum: 0
      required:
      - countedCashPaisa
    ShiftOpenRequest:
      type: object
      properties:
        locationId:
          type: string
          format: uuid
        openingFloatPaisa:
          type: integer
          maximum: 10000000
          minimum: 0
      required:
      - locationId
      - openingFloatPaisa
    ShiftSummary:
      type: object
      properties:
        shift:
          $ref: '#/components/schemas/Shift'
        captureCount:
          type: integer
        cashCapturedPaisa:
          type: integer
        expectedCashPaisa:
          type: integer
      required:
      - captureCount
      - cashCapturedPaisa
      - expectedCashPaisa
      - shift
    TariffPublishRequest:
      type: object
      properties:
        vehicleClass:
          $ref: '#/components/schemas/VehicleClassEnum'
        effectiveFrom:
          type: string
          format: date-time
        graceSeconds:
          type: integer
          maximum: 86400
          minimum: 0
        blockSeconds:
          type: integer
          maximum: 86400
          minimum: 60
        blockPaisa:
          type: integer
          maximum: 10000000
          minimum: 0
        dailyCapPaisa:
          type: integer
          maximum: 10000000
          minimum: 1
          nullable: true
        taxBps:
          type: integer
          maximum: 10000
          minimum: 0
          default: 0
      required:
      - blockPaisa
      - blockSeconds
      - graceSeconds
      - vehicleClass
    TariffStatusEnum:
      enum:
      - SCHEDULED
      - CURRENT
      - SUPERSEDED
      type: string
      description: |-
        * `SCHEDULED` - Scheduled
        * `CURRENT` - Current
        * `SUPERSEDED` - Superseded
    TariffVersion:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        locationId:
          type: string
          format: uuid
          readOnly: true
        vehicleClass:
          allOf:
          - $ref: '#/components/schemas/VehicleClassEnum'
          readOnly: true
        effectiveFrom:
          type: string
          format: date-time
          readOnly: true
        graceSeconds:
          type: integer
          readOnly: true
        blockSeconds:
          type: integer
          readOnly: true
        blockPaisa:
          type: integer
          readOnly: true
        dailyCapPaisa:
          type: integer
          readOnly: true
          nullable: true
        taxBps:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/TariffStatusEnum'
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
      required:
      - blockPaisa
      - blockSeconds
      - createdAt
      - dailyCapPaisa
      - effectiveFrom
      - graceSeconds
      - id
      - locationId
      - status
      - taxBps
      - vehicleClass
    VehicleClassEnum:
      enum:
      - CAR
      - MOTORBIKE
      type: string
      description: |-
        * `CAR` - Car
        * `MOTORBIKE` - Motorbike
    VehicleLogReport:
      type: object
      properties:
        scope:
          $ref: '#/components/schemas/ReportScope'
        rows:
          type: array
          items:
            $ref: '#/components/schemas/VehicleLogRow'
        entries:
          type: integer
        exits:
          type: integer
        stillParked:
          type: integer
      required:
      - entries
      - exits
      - rows
      - scope
      - stillParked
    VehicleLogRow:
      type: object
      properties:
        enteredAt:
          type: string
          format: date-time
        exitedAt:
          type: string
          format: date-time
          nullable: true
        status:
          $ref: '#/components/schemas/SessionStatusEnum'
        plate:
          type: string
        vehicleClass:
          $ref: '#/components/schemas/VehicleClassEnum'
        bayLabel:
          type: string
        locationName:
          type: string
        enteredByName:
          type: string
        exitedByName:
          type: string
          nullable: true
      required:
      - bayLabel
      - enteredAt
      - enteredByName
      - exitedAt
      - exitedByName
      - locationName
      - plate
      - status
      - vehicleClass
    ZoneCreateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        pools:
          type: array
          items:
            $ref: '#/components/schemas/PoolCreateRequest'
      required:
      - name
      - pools
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
