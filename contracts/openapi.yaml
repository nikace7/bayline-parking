          description: ''
  /api/v1/invoices/{invoice_id}/payments:
    post:
      operationId: invoices_payments_create
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: One per intended change. Retrying with the same key replays the
          first result.
        required: true
      - in: path
        name: invoice_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - invoices
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CashPaymentRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/PaymentEntry'
          description: ''
  /api/v1/locations:
    get:
      operationId: locations_list
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - locations
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLocationList'
          description: ''
    post:
      operationId: locations_create
