        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Member'
          description: ''
  /api/v1/parking/entries:
    post:
      operationId: parking_entries_create
      parameters:
      - in: header
