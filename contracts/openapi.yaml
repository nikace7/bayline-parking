      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntryRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/ParkingSession'
          description: ''
  /api/v1/parking/sessions:
    get:
      operationId: parking_sessions_list
      parameters:
      - name: cursor
        required: false
