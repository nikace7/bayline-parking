components:
  schemas:
    Availability:
      type: object
      properties:
        locationId:
          type: string
          format: uuid
        vehicleClass:
          $ref: '#/components/schemas/VehicleClassEnum'
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        availableBays:
          type: integer
        asOf:
          type: string
          format: date-time
      required:
      - asOf
      - availableBays
      - endsAt
      - locationId
      - startsAt
      - vehicleClass
    Bay:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        locationId:
          type: string
          format: uuid
          readOnly: true
        label:
          type: string
          pattern: ^[A-Z0-9-]{1,16}$
        vehicleClass:
          $ref: '#/components/schemas/VehicleClassEnum'
        mode:
          $ref: '#/components/schemas/BayModeEnum'
        state:
          allOf:
          - $ref: '#/components/schemas/BayStateEnum'
          readOnly: true
        revision:
          type: integer
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
      required:
      - createdAt
      - id
      - label
      - locationId
      - mode
      - revision
      - state
      - vehicleClass
    BayModeEnum:
      enum:
      - WALK_IN
      - RESERVABLE
      type: string
      description: |-
        * `WALK_IN` - Walk In
        * `RESERVABLE` - Reservable
    BayRequest:
      type: object
      properties:
        label:
          type: string
          minLength: 1
          pattern: ^[A-Z0-9-]{1,16}$
        vehicleClass:
          $ref: '#/components/schemas/VehicleClassEnum'
        mode:
          $ref: '#/components/schemas/BayModeEnum'
      required:
      - label
      - mode
      - vehicleClass
    BayStateEnum:
      enum:
      - ACTIVE
      - OUT_OF_SERVICE
      type: string
      description: |-
        * `ACTIVE` - Active
        * `OUT_OF_SERVICE` - Out Of Service
    CancelRequest:
      type: object
      properties:
        reason:
          type: string
          default: ''
          maxLength: 240
    CapacityPool:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        vehicleClass:
          allOf:
          - $ref: '#/components/schemas/VehicleClassEnum'
          readOnly: true
        capacity:
          type: integer
          readOnly: true
        state:
          allOf:
          - $ref: '#/components/schemas/BayStateEnum'
          readOnly: true
        revision:
          type: integer
          readOnly: true
        occupied:
          type: integer
          readOnly: true
      required:
      - capacity
      - id
      - occupied
      - revision
      - state
      - vehicleClass
    CashPaymentRequest:
      type: object
      properties:
        method:
          $ref: '#/components/schemas/PaymentMethodEnum'
        amountPaisa:
          type: integer
          maximum: 10000000
          minimum: 1
      required:
      - amountPaisa
      - method
    CheckoutRequest:
      type: object
      properties:
        quoteToken:
          type: string
          minLength: 1
          maxLength: 512
      required:
      - quoteToken
    CollectionRow:
      type: object
      properties:
        postedAt:
          type: string
          format: date-time
        receiptNumber:
          type: string
          nullable: true
        locationName:
          type: string
        plate:
          type: string
        method:
          $ref: '#/components/schemas/PaymentMethodEnum'
        kind:
          $ref: '#/components/schemas/EntryKindEnum'
        amountPaisa:
          type: integer
        receivedByName:
          type: string
      required:
      - amountPaisa
      - kind
      - locationName
      - method
      - plate
      - postedAt
      - receiptNumber
      - receivedByName
    CollectionsReport:
      type: object
      properties:
        scope:
          $ref: '#/components/schemas/ReportScope'
        rows:
          type: array
          items:
            $ref: '#/components/schemas/CollectionRow'
        byMethod:
          type: array
          items:
            $ref: '#/components/schemas/MethodTotal'
        capturedPaisa:
          type: integer
        refundedPaisa:
          type: integer
        netPaisa:
          type: integer
      required:
      - byMethod
      - capturedPaisa
      - netPaisa
      - refundedPaisa
      - rows
      - scope
    CurrentShift:
      type: object
      properties:
        shift:
          allOf:
          - $ref: '#/components/schemas/Shift'
          nullable: true
      required:
      - shift
    Customer:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        email:
          type: string
          readOnly: true
        phone:
          type: string
          readOnly: true
        hasOnlineAccount:
          type: boolean
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
      required:
      - createdAt
      - email
      - hasOnlineAccount
      - id
      - name
      - phone
    CustomerCreateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          oneOf:
          - type: string
            format: email
            default: ''
            maxLength: 254
          - type: string
            maxLength: 0
        phone:
          type: string
          default: ''
          maxLength: 32
      required:
      - name
    CustomerRegisterRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - email
      - name
      - password
    EntryKindEnum:
      enum:
      - CAPTURE
      type: string
      description: '* `CAPTURE` - Capture'
    EntryRequest:
      type: object
      properties:
        locationId:
          type: string
          format: uuid
        bayId:
          type: string
          format: uuid
        poolId:
          type: string
          format: uuid
        plate:
          type: string
          minLength: 1
          maxLength: 16
        vehicleClass:
          $ref: '#/components/schemas/VehicleClassEnum'
        reservationId:
          type: string
          format: uuid
          nullable: true
      required:
      - locationId
      - plate
      - vehicleClass
    Health:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    HoldRequest:
      type: object
      properties:
        locationId:
          type: string
          format: uuid
        vehicleClass:
          $ref: '#/components/schemas/VehicleClassEnum'
        plate:
          type: string
          minLength: 1
          maxLength: 16
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
      required:
      - endsAt
      - locationId
      - plate
      - startsAt
      - vehicleClass
    Invoice:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        cutoffAt:
          type: string
          format: date-time
          readOnly: true
        billableSeconds:
          type: integer
          readOnly: true
        blocks:
          type: integer
          readOnly: true
        basePaisa:
          type: integer
          readOnly: true
        discountPaisa:
          type: integer
          readOnly: true
        taxPaisa:
          type: integer
          readOnly: true
        totalPaisa:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/InvoiceStatusEnum'
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
      required:
      - basePaisa
      - billableSeconds
      - blocks
      - createdAt
      - cutoffAt
      - discountPaisa
      - id
      - status
      - taxPaisa
      - totalPaisa
    InvoiceStatusEnum:
      enum:
      - CONFIRMED
      type: string
      description: '* `CONFIRMED` - Confirmed'
    Location:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 120
        address:
          type: string
          maxLength: 240
        latitude:
          type: number
          format: double
          maximum: 90
          minimum: -90
        longitude:
          type: number
          format: double
          maximum: 180
          minimum: -180
        receiptPrefix:
          type: string
          pattern: ^[A-Z0-9]{2,8}$
        timezone:
          type: string
          readOnly: true
        enabled:
          type: boolean
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
      required:
      - address
      - createdAt
      - enabled
      - id
      - latitude
      - longitude
      - name
      - receiptPrefix
      - timezone
    LocationRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        address:
          type: string
          minLength: 1
          maxLength: 240
        latitude:
          type: number
          format: double
          maximum: 90
          minimum: -90
        longitude:
          type: number
          format: double
          maximum: 180
          minimum: -180
        receiptPrefix:
          type: string
          minLength: 1
          pattern: ^[A-Z0-9]{2,8}$
      required:
      - address
      - latitude
      - longitude
      - name
      - receiptPrefix
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - email
      - password
    Member:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        name:
          type: string
          readOnly: true
        roles:
