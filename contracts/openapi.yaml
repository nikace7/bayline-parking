        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: locationId
        schema:
          type: string
          format: uuid
      - in: query
        name: status
        schema:
          enum:
          - PARKED
          - EXITED
          type: string
          minLength: 1
        description: |-
          * `PARKED` - Parked
          * `EXITED` - Exited
      tags:
      - parking
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSessionSummaryList'
