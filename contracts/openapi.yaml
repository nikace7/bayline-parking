        customerName:
          type: string
          readOnly: true
        customerEmail:
          type: string
          readOnly: true
        customerPhone:
          type: string
          readOnly: true
        customerId:
          type: string
          format: uuid
          readOnly: true
        plates:
          type: array
          items:
            type: string
          readOnly: true
        locationNames:
          type: array
          items:
            type: string
          readOnly: true
        startsAt:
          type: string
          format: date-time
          readOnly: true
        endsAt:
          type: string
          format: date-time
          readOnly: true
        coveredSeconds:
          type: integer
          readOnly: true
        maxVehicles:
          type: integer
          readOnly: true
        pricePaisa:
          type: integer
