  /api/v1/members/{member_id}:
    get:
      operationId: members_retrieve
      parameters:
      - in: path
        name: member_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - members
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Member'
          description: ''
    patch:
      operationId: members_partial_update
      parameters:
      - in: path
        name: member_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
